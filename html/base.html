<!doctype html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation Games Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <a class="brand" href="#">
        <img class="logo" src="images/logo.png" alt="PlayStation Logo">
        <span class="brand-name">PlayStation <small>Games Tracker</small></span>
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Hlavná navigácia">
        <a class="nav-item" href="#">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <rect width="7" height="9" x="3" y="3" rx="1"/>
                <rect width="7" height="5" x="14" y="3" rx="1"/>
                <rect width="7" height="9" x="14" y="12" rx="1"/>
                <rect width="7" height="5" x="3" y="16" rx="1"/>
            </svg>
            <span>Prehľad</span>
        </a>
        <a class="nav-item" href="#">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>
            </svg>
            <span>Katalóg hier</span>
        </a>
        <a class="nav-item" href="#">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="m16 6 4 14"/>
                <path d="M12 6v14"/>
                <path d="M8 8v12"/>
                <path d="M4 4v16"/>
            </svg>
            <span>Moja zbierka</span>
        </a>
        <a class="nav-item" href="#">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="5"/>
                <path d="M20 21a8 8 0 0 0-16 0"/>
            </svg>
            <span>Môj profil</span>
        </a>
    </nav>
    <details class="account">
        <summary class="avatar-button">M</summary>
        <div class="account-menu">
            <strong>Môj účet</strong>
            <a href="#">Nastavenia</a>
            <a href="#">Odhlásiť sa</a>
        </div>
    </details>
</header>
<main class="body-content">
    <section class="content-placeholder">
        <span>Priestor pre obsah stránky</span>
    </section>
</main>
</body>
</html>
